name: Build and publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test question service
        run: python3 -m unittest discover -s tests -v
      - name: Install Godot 4.7.2
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 --output .tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .tools/godot.zip' | sha256sum --check
          unzip -q .tools/godot.zip -d .tools
          mv .tools/Godot_v4.7.2-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          python3 tools/fetch_web_template.py
      - name: Import game
        run: .tools/godot --headless --path game --editor --quit
      - name: Verify gameplay and category combinations
        timeout-minutes: 3
        run: .tools/godot --headless --path game --script res://tests.gd
      - name: Export GitHub Pages build
        run: GODOT_BIN="$PWD/.tools/godot" sh tools/export_pages.sh
      - name: Upload game
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: builds/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

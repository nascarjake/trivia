[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests.gd"
export_path="../builds/web/index.html"

[preset.0.options]
custom_template/debug="../.tools/web_nothreads_debug.zip"
custom_template/release="../.tools/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="GitHub Pages"
custom_features="github_pages"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests.gd"
export_path="../builds/pages/index.html"

[preset.1.options]
custom_template/debug="../.tools/web_nothreads_debug.zip"
custom_template/release="../.tools/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

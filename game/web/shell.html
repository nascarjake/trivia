<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millionaire · Trending Edition</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050e;color:#e8ecff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:#03050e;font-size:12px;letter-spacing:3px}progress{width:220px;height:3px;accent-color:#d8b66d}#error{max-width:600px;letter-spacing:normal;line-height:1.7}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Millionaire 3D trivia game"></canvas>
<div id="loading"><span>PREPARING THE STUDIO</span><progress id="progress"></progress><div id="error"></div></div>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{const p=document.getElementById('progress');if(total&&p){p.max=total;p.value=current;}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();}).catch(()=>{document.getElementById('error').textContent='The studio could not load. Please use a browser with WebGL 2 enabled and reload.';});
</script>
</body>
</html>
